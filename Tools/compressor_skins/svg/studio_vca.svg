<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <!-- Definitions for gradients and materials -->
  <defs>
    <!-- Brushed Crimson Aluminum Plate Background -->
    <linearGradient id="red3_faceplate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A81D22"/>
      <stop offset="40%" stop-color="#D2232A"/>
      <stop offset="50%" stop-color="#C01F25"/>
      <stop offset="60%" stop-color="#D2232A"/>
      <stop offset="100%" stop-color="#701014"/>
    </linearGradient>
    
    <!-- Anodized Metallic Noise Overlay Pattern Simulation -->
    <pattern id="brushed_aluminum" width="10" height="2" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="10" y2="0" stroke="#ffffff" stroke-width="0.3" opacity="0.07"/>
      <line x1="0" y1="1" x2="10" y2="1" stroke="#000000" stroke-width="0.3" opacity="0.05"/>
    </pattern>

    <!-- Vintage Knob Outer Rim Gradient -->
    <linearGradient id="knob_metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555555"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Warm Incandescent VU Meter Backlight Glow -->
    <radialGradient id="vu_glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF4D0"/>
      <stop offset="70%" stop-color="#FCE19C"/>
      <stop offset="100%" stop-color="#D9A752"/>
    </radialGradient>

    <!-- Drop Shadows for Knobs and Panels -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="inset_shadow">
      <feOffset dx="1" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.8" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Base Faceplate Structure -->
  <rect width="1000" height="450" fill="url(#red3_faceplate)"/>
  <rect width="1000" height="450" fill="url(#brushed_aluminum)"/>

  <!-- Hardware Chassis Bezel Lines & Accents -->
  <line x1="0" y1="5" x2="1000" y2="5" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
  <line x1="0" y1="445" x2="1000" y2="445" stroke="#000000" stroke-width="0.8" opacity="0.5"/>

  <!-- Rack Ear Screws (Left & Right Ends) -->
  <circle cx="20" cy="30" r="6" fill="#444" stroke="#222" stroke-width="1"/>
  <line x1="15" y1="30" x2="25" y2="30" stroke="#111" stroke-width="1.5"/>
  <circle cx="20" cy="420" r="6" fill="#444" stroke="#222" stroke-width="1"/>
  <line x1="15" y1="420" x2="25" y2="420" stroke="#111" stroke-width="1.5"/>
  <circle cx="980" cy="30" r="6" fill="#444" stroke="#222" stroke-width="1"/>
  <line x1="975" y1="30" x2="985" y2="30" stroke="#111" stroke-width="1.5"/>
  <circle cx="980" cy="420" r="6" fill="#444" stroke="#222" stroke-width="1"/>
  <line x1="975" y1="420" x2="985" y2="420" stroke="#111" stroke-width="1.5"/>

  <!-- ================= BRANDING SECTION ================= -->
  <g transform="translate(60, 160)" filter="url(#shadow)">
    <!-- Classic Iconic Logo Badge Shape -->
    <ellipse cx="45" cy="20" rx="30" ry="16" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
    <text x="45" y="24" font-family="Georgia, serif" font-size="13" font-style="italic" font-weight="bold" fill="#ffffff" text-anchor="middle">VCA</text>
    <text x="45" y="55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="900" letter-spacing="2" fill="#ffffff" text-anchor="middle">STUDIO VCA</text>
    <text x="45" y="70" font-family="sans-serif" font-size="7" font-weight="bold" letter-spacing="1" fill="#FFF" opacity="0.7" text-anchor="middle">DUAL VCA COMPRESSOR</text>
  </g>

  <!-- ================= THE DUAL VU METERS ================= -->
  <!-- Top Meter: Input/Output Levels -->
  <g transform="translate(730, 45)" filter="url(#shadow)">
    <rect width="210" height="150" rx="15" fill="#151515" stroke="#2c2c2c" stroke-width="3"/>
    <path d="M 15 15 L 195 15 L 195 115 L 15 115 Z" fill="url(#vu_glow)"/>
    <!-- Meter Text Scale labels -->
    <text x="105" y="110" font-family="sans-serif" font-size="10" font-weight="bold" fill="#222" text-anchor="middle">INPUT / OUTPUT LEVEL</text>
    <path d="M 30 85 C 60 40, 150 40, 180 85" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="1,3"/>
    <!-- Simulated Physical Needle -->
    <line x1="105" y1="130" x2="155" y2="55" stroke="#D32F2F" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="105" cy="130" r="8" fill="#111"/>
  </g>

  <!-- Bottom Meter: Gain Reduction Tracking -->
  <g transform="translate(730, 235)" filter="url(#shadow)">
    <rect width="210" height="150" rx="15" fill="#151515" stroke="#2c2c2c" stroke-width="3"/>
    <path d="M 15 15 L 195 15 L 195 115 L 15 115 Z" fill="url(#vu_glow)"/>
    <text x="105" y="110" font-family="sans-serif" font-size="10" font-weight="bold" fill="#222" text-anchor="middle">GAIN REDUCTION</text>
    <path d="M 30 85 C 60 40, 150 40, 180 85" fill="none" stroke="#222" stroke-width="2"/>
    <!-- GR Needle sitting natively at 0dB resting position (right side) -->
    <line x1="105" y1="130" x2="168" y2="52" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="105" cy="130" r="8" fill="#111"/>
  </g>

  <!-- ================= KNOBS GROUP (KNOB SKIN ASSETS) ================= -->
  <!-- Template layout layout for manual adjustment or canvas generation mapping -->
  
  <!-- Knob 1: Input Drive (X: 230, Y: 95) -->
  <g transform="translate(230, 95)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="32" fill="url(#knob_metal)" stroke="#333" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="26" fill="#1a1a1a"/>
    <!-- Classic Silver Accent Cap Cap Insert -->
    <circle cx="0" cy="0" r="16" fill="#cccccc" opacity="0.15"/>
    <!-- Pointer Line Positioned dynamically -->
    <line x1="0" y1="0" x2="-18" y2="-18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="48" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">INPUT DRIVE</text>
  </g>

  <!-- Knob 2: Threshold (X: 230, Y: 245) -->
  <g transform="translate(230, 245)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="32" fill="url(#knob_metal)" stroke="#333" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="26" fill="#1a1a1a"/>
    <line x1="0" y1="0" x2="0" y2="-24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="48" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">THRESHOLD</text>
  </g>

  <!-- Knob 3: Ratio (X: 380, Y: 95) -->
  <g transform="translate(380, 95)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="32" fill="url(#knob_metal)" stroke="#333" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="26" fill="#1a1a1a"/>
    <line x1="0" y1="0" x2="-22" y2="10" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="48" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">RATIO</text>
  </g>

  <!-- Knob 4: Attack (X: 530, Y: 95) -->
  <g transform="translate(530, 95)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="32" fill="url(#knob_metal)" stroke="#333" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="26" fill="#1a1a1a"/>
    <line x1="0" y1="0" x2="-10" y2="-22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="48" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ATTACK</text>
  </g>

  <!-- Knob 5: Release (X: 580, Y: 245) -->
  <g transform="translate(580, 245)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="32" fill="url(#knob_metal)" stroke="#333" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="26" fill="#1a1a1a"/>
    <line x1="0" y1="0" x2="20" y2="-12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="48" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">RELEASE</text>
  </g>

  <!-- Knob 6: VCA Blend Control (Unique Twist Module) (X: 380, Y: 245) -->
  <g transform="translate(380, 245)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="32" fill="url(#knob_metal)" stroke="#333" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="26" fill="#152238" stroke="#388E3C" stroke-width="1"/> <!-- Tinted green to highlight feature -->
    <line x1="0" y1="0" x2="0" y2="-24" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="48" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4CAF50" text-anchor="middle">VCA BLEND</text>
  </g>

  <!-- ================= PUSH BUTTONS / TOGGLES ================= -->
  <!-- Smart-Auto Toggle Switch -->
  <g transform="translate(480, 365)">
    <text x="0" y="-15" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">SMART-AUTO</text>
    <rect x="-15" y="0" width="30" height="16" rx="4" fill="#222" stroke="#444"/>
    <!-- Yellow glowing illuminated latch switch state status active -->
    <circle cx="0" cy="8" r="5" fill="#FFEB3B" filter="drop-shadow(0px 0px 3px #FFEB3B)"/>
  </g>

  <!-- Link Audio Channel Toggle Switch -->
  <g transform="translate(560, 365)">
    <text x="0" y="-15" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">STEREO LINK</text>
    <rect x="-15" y="0" width="30" height="16" rx="4" fill="#222" stroke="#444"/>
    <circle cx="0" cy="8" r="5" fill="#444"/>
  </g>
</svg>