# Builds, tests and packages Audio Tech Pro on GitHub's computers, whenever you push or start it by
# hand (Actions tab > Build > Run workflow):
#   Mac:      "Audio Tech Pro <version>.dmg", "Audio Tech Pro <version>.pkg" and "Uninstall Audio Tech Pro.pkg"
#             (one app for Apple Silicon and Intel)
#   Windows:  "Audio Tech Pro <version> Setup.exe" (64-bit)
# The files are attached to each run (the run's page > Artifacts), and when both builds pass they're
# published on the repository's Releases page as "Audio Tech Pro <version>" (replacing that version's
# files if it's built again).
name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # (to publish a release for a tag)

jobs:
  mac:
    # (the Intel image: the Apple-silicon runners have been unavailable; the app is built universal either way)
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # (a compile cache kept between runs: only the files that changed are compiled again, not all of JUCE)
      - name: Compile cache
        run: brew install ccache && ccache --max-size=3G && ccache --zero-stats
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-mac-${{ github.sha }}
          restore-keys: ccache-mac-
      - name: Build the app and the disk image (.dmg)
        env:
          RIFF_BUILD_TESTS: "ON"
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_OBJC_COMPILER_LAUNCHER: ccache
          CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache
        run: sh scripts/make-mac-dmg.sh && ccache --show-stats
      - name: Test
        # (failures are listed in one annotation on the run's page, so they can be read without the log)
        run: |
          set +e
          ./build-universal/AudioTechProTests_artefacts/Release/AudioTechProTests --reporter compact > test-output.txt 2>&1
          code=$?
          cat test-output.txt
          if [ $code -ne 0 ]; then
            failed=$(grep -E 'failed|FAILED|error' test-output.txt | head -120 | awk '{printf "%s%%0A", $0}')
            echo "::error title=Mac test failures::$failed"
            exit $code
          fi
      - name: Installer and uninstaller (.pkg)
        env:
          RIFF_BUILD_TESTS: "ON"
        run: sh scripts/make-mac-pkg.sh
      - name: Collect
        run: |
          mkdir -p out
          mv ../*.dmg ../*.pkg out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: AudioTechPro-mac
          path: out/

  windows:
    # (paused: the Mac version first - set back to run when Windows is worked on again)
    if: ${{ false }}
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build-windows -G "Visual Studio 17 2022" -A x64
      - name: Build
        # (compile errors are listed in one annotation on the run's page, so they can be read without the log)
        shell: pwsh
        run: |
          $out = & cmake --build build-windows --config Release --parallel 2>&1 | Out-String
          $code = $LASTEXITCODE
          $out | Write-Output
          if ($code -ne 0) {
            $errors = ($out -split "`r?`n" | Where-Object { $_ -match ': error |: fatal error|error C|error LNK' } | Select-Object -Unique -First 60) -join '%0A'
            Write-Output "::error title=Windows build errors::$errors"
            exit $code
          }
      - name: Test
        # (failures are listed in one annotation on the run's page, so they can be read without the log)
        shell: pwsh
        run: |
          $out = & build-windows\AudioTechProTests_artefacts\Release\AudioTechProTests.exe --reporter compact 2>&1 | Out-String
          $code = $LASTEXITCODE
          $out | Write-Output
          if ($code -ne 0) {
            $failed = ($out -split "`r?`n" | Where-Object { $_ -match 'failed|FAILED|error' } | Select-Object -First 120) -join '%0A'
            Write-Output "::error title=Windows test failures::$failed"
            exit $code
          }
      - name: Installer (Setup.exe)
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(AudioTechPro VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          } else { $iscc = "iscc" }
          if (-not (Test-Path $iscc) -and $iscc -ne "iscc") { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          New-Item -ItemType Directory -Force out | Out-Null
          & $iscc "/DAppVersion=$version" "/DBuildDir=..\..\build-windows\AudioTechPro_artefacts\Release" "/DOutputDir=..\..\out" installer\windows\AudioTechPro.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: AudioTechPro-windows
          path: out/

  plugins:
    # The classic and mastering compressors and the classic EQs as VST3 and Audio Unit plug-ins (one for Apple Silicon
    # and Intel): "Audio Tech Pro Plugins <version>.pkg" (installs them) and a .zip of the same
    runs-on: macos-15-intel
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Compile cache
        run: brew install ccache && ccache --max-size=3G && ccache --zero-stats
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-plugins-${{ github.sha }}
          restore-keys: ccache-plugins-
      - name: Build the plug-ins
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_OBJC_COMPILER_LAUNCHER: ccache
          CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache
        run: |
          cmake -B build-plugins -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DRIFF_BUILD_TESTS=OFF -DRIFF_BUILD_PLUGINS=ON
          cmake --build build-plugins --config Release --target RiffPlugins -j "$(sysctl -n hw.ncpu)"
          ccache --show-stats
      - name: Package (.pkg and .zip)
        run: sh scripts/make-mac-plugins.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AudioTechPro-plugins
          path: out-plugins/

  release:
    needs: [ mac, plugins ]
    if: ${{ always() && needs.mac.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: echo "number=$(sed -n 's/^project(AudioTechPro VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.number }}
          target_commitish: ${{ github.sha }}
          name: Audio Tech Pro ${{ steps.version.outputs.number }}
          body: |
            Mac (Apple Silicon and Intel, macOS 11+): open the .dmg and drag Audio Tech Pro onto Applications, or use the .pkg installer. The first time, right-click the app and choose Open.

            Plug-ins (VST3 and AU, for Logic, Ableton, Pro Tools via VST3 hosts, Studio One...): the Classic Compressors, the Mastering Compressors and the classic EQs. Run "Audio Tech Pro Plugins" .pkg (right-click > Open the first time), or unzip and copy the .vst3 files to /Library/Audio/Plug-Ins/VST3 and the .component files to /Library/Audio/Plug-Ins/Components.
          files: files/*
          overwrite_files: true
