# Builds, tests and packages Audio Tech Pro on GitHub's computers, whenever you push or start it by
# hand (Actions tab > Build > Run workflow):
#   Mac:      "Audio Tech Pro <version>.dmg", "Audio Tech Pro <version>.pkg" and "Uninstall Audio Tech Pro.pkg"
#             (one app for Apple Silicon and Intel)
#   Windows:  "Audio Tech Pro <version> Setup.exe" (64-bit)
# The files are attached to each run (the run's page > Artifacts), and when both builds pass they're
# published on the repository's Releases page as "Audio Tech Pro <version>" (replacing that version's
# files if it's built again).
name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # (to publish a release for a tag)

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build the app and the disk image (.dmg)
        env:
          RIFF_BUILD_TESTS: "ON"
        run: sh scripts/make-mac-dmg.sh
      - name: Test
        # (failures are listed in one annotation on the run's page, so they can be read without the log)
        run: |
          set +e
          ./build-universal/AudioTechProTests_artefacts/Release/AudioTechProTests --reporter compact > test-output.txt 2>&1
          code=$?
          cat test-output.txt
          if [ $code -ne 0 ]; then
            failed=$(grep -E 'failed|FAILED|error' test-output.txt | head -120 | awk '{printf "%s%%0A", $0}')
            echo "::error title=Mac test failures::$failed"
            exit $code
          fi
      - name: Installer and uninstaller (.pkg)
        env:
          RIFF_BUILD_TESTS: "ON"
        run: sh scripts/make-mac-pkg.sh
      - name: Collect
        run: |
          mkdir -p out
          mv ../*.dmg ../*.pkg out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: AudioTechPro-mac
          path: out/

  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build-windows -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build-windows --config Release --parallel
      - name: Test
        # (failures are listed in one annotation on the run's page, so they can be read without the log)
        shell: pwsh
        run: |
          $out = & build-windows\AudioTechProTests_artefacts\Release\AudioTechProTests.exe --reporter compact 2>&1 | Out-String
          $code = $LASTEXITCODE
          $out | Write-Output
          if ($code -ne 0) {
            $failed = ($out -split "`r?`n" | Where-Object { $_ -match 'failed|FAILED|error' } | Select-Object -First 120) -join '%0A'
            Write-Output "::error title=Windows test failures::$failed"
            exit $code
          }
      - name: Installer (Setup.exe)
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(AudioTechPro VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          } else { $iscc = "iscc" }
          if (-not (Test-Path $iscc) -and $iscc -ne "iscc") { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          New-Item -ItemType Directory -Force out | Out-Null
          & $iscc "/DAppVersion=$version" "/DBuildDir=..\..\build-windows\AudioTechPro_artefacts\Release" "/DOutputDir=..\..\out" installer\windows\AudioTechPro.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: AudioTechPro-windows
          path: out/

  release:
    needs: [ mac, windows ]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: echo "number=$(sed -n 's/^project(AudioTechPro VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.number }}
          target_commitish: ${{ github.sha }}
          name: Audio Tech Pro ${{ steps.version.outputs.number }}
          body: |
            Mac (Apple Silicon and Intel, macOS 11+): open the .dmg and drag Audio Tech Pro onto Applications, or use the .pkg installer. The first time, right-click the app and choose Open.
            Windows (64-bit): run the Setup.exe. If SmartScreen warns, click More info > Run anyway.
          files: files/*
          overwrite_files: true
